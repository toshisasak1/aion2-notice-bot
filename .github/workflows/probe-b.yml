name: 試験 B 新着通知と同じ構成

on:
  schedule:
    # 本番と同じく日本語のコメント付き
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      latest:
        description: "テスト用: 各掲示板の最新N件を既読に関係なく送る(0 で通常動作)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: probe-b
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: 試験
        env:
          LATEST: ${{ inputs.latest || '0' }}
        run: echo "probe-b ok latest=$LATEST"
